name: Jira Trigger

on:
  repository_dispatch:
    types:
      - jira-assigned

jobs:
  run-workitem-tests:

    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Jira Issue Key
        shell: powershell
        run: |
          $issueKey = "${{ github.event.client_payload.issueKey }}"
          Write-Host "Issue Key: $issueKey"
          Set-Content -Path issue.txt -Value $issueKey

      - name: Find Matching WorkItem Classes
        shell: powershell
        run: |

          $issueKey = Get-Content issue.txt

          if (Test-Path tests-to-run.txt) {
            Remove-Item tests-to-run.txt
          }

          Get-ChildItem -Path "src/test/java" -Recurse -Filter "*.java" | ForEach-Object {

            $content = Get-Content $_.FullName -Raw

            if ($content -match "id\s*=\s*`"$issueKey`"") {

              Write-Host "Found class: $($_.BaseName)"

              Add-Content tests-to-run.txt $_.BaseName
            }
          }

          if (!(Test-Path tests-to-run.txt)) {
            throw "No test classes found for $issueKey"
          }

          Write-Host ""
          Write-Host "Classes to execute:"
          Get-Content tests-to-run.txt

      - name: Execute Matching Tests
        shell: powershell
        run: |

          if (Test-Path execution-status.txt) {
            Remove-Item execution-status.txt
          }

          $tests = Get-Content tests-to-run.txt

          foreach ($test in $tests) {

            Write-Host ""
            Write-Host "Executing $test"

            mvn test `
              "-Dtest=$test" `
              "-DargLine=-javaagent:D:\parasoft_selenic_2026.1.0\selenic_agent.jar=captureDOM=true,screenshot=failures,selfHealing=true,createAPITests=false" `
              "-Dwebdriver.chrome.driver=D:\chromedriver-win64\chromedriver-win64\chromedriver.exe"

            if ($LASTEXITCODE -eq 0) {
              Add-Content execution-status.txt "$test : PASSED"
            }
            else {
              Add-Content execution-status.txt "$test : FAILED"
            }
          }

      - name: Show Results
        if: always()
        shell: powershell
        run: |

          if (Test-Path execution-status.txt) {
            Get-Content execution-status.txt
          }
          else {
            Write-Host "No execution results"
          }

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload Selenic Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenic-reports
          path: D:\tias\selenic_report

      - name: Upload Execution Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-status
          path: execution-status.txt

      - name: Update Jira
        if: always()
        shell: powershell
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |

          $issueKey = (Get-Content issue.txt).Trim()

          Write-Host "====================================="
          Write-Host "JIRA VALIDATION"
          Write-Host "====================================="

          Write-Host "Issue Key: $issueKey"
          Write-Host "JIRA URL: $env:JIRA_URL"

          $pair = "$($env:JIRA_EMAIL):$($env:JIRA_TOKEN)"
          $bytes = [System.Text.Encoding]::ASCII.GetBytes($pair)
          $encoded = [System.Convert]::ToBase64String($bytes)

          $headers = @{
              Authorization = "Basic $encoded"
              Accept = "application/json"
          }

          $jiraIssueUrl = "$($env:JIRA_URL)/rest/api/3/issue/$issueKey"

          Write-Host "Calling:"
          Write-Host $jiraIssueUrl

          try {

              $response = Invoke-RestMethod `
                  -Method GET `
                  -Uri $jiraIssueUrl `
                  -Headers $headers

              Write-Host ""
              Write-Host "SUCCESS"
              Write-Host "Issue Found:"
              Write-Host $response.key

          }
          catch {

              Write-Host ""
              Write-Host "FAILED"

              if ($_.Exception.Response) {

                  $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
                  $reader.BaseStream.Position = 0
                  $reader.DiscardBufferedData()
                  $responseBody = $reader.ReadToEnd()

                  Write-Host "Response Body:"
                  Write-Host $responseBody
              }

              throw
          }
