name: Execute New Test Classes

on:
  push:
    branches:
      - main

jobs:
  execute-new-tests:

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find Changed Files
        shell: cmd
        run: |
          git diff --name-only HEAD~1 HEAD > changedfiles.txt

          echo ==================================
          echo CHANGED FILES
          echo ==================================

          type changedfiles.txt

      - name: Find New Java Test Files
        shell: cmd
        run: |

          if exist newtests.txt del newtests.txt

          for /f %%i in (changedfiles.txt) do (

            echo %%i | findstr /i "src/test/java" >nul

            if not errorlevel 1 (
              echo %%i>>newtests.txt
            )
          )

          if not exist newtests.txt (
            echo ==================================
            echo NO NEW TEST FILES FOUND
            echo ==================================
            exit /b 0
          )

          echo ==================================
          echo TEST FILES FOUND
          echo ==================================

          type newtests.txt

      - name: Execute New Test Classes
        shell: cmd
        run: |

          if not exist newtests.txt (
            echo No tests to execute.
            exit /b 0
          )

          for /f %%i in (newtests.txt) do (

            for %%j in ("%%i") do (

              echo.
              echo ==================================
              echo Running %%~nj
              echo ==================================

              mvn test ^
              -Dtest=%%~nj ^
              -DargLine="-javaagent:D:\parasoft_selenic_2026.1.0\selenic_agent.jar=captureDOM=true,screenshot=failures,selfHealing=true,createAPITests=false" ^
              -Dwebdriver.chrome.driver="D:\chromedriver-win64\chromedriver-win64\chromedriver.exe"

            )
          )
