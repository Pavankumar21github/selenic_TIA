name: Execute New Test Methods

on:
  push:
    branches:
      - main

jobs:
  execute-new-tests:

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect New Test Methods
        shell: powershell
        run: |
          .\scripts\Detect-NewTests.ps1

      - name: Execute New Test Methods
        shell: powershell
        run: |

          if (!(Test-Path tests-to-run.txt)) {
              Write-Host "No tests to execute."
              exit 0
          }

          $tests = Get-Content tests-to-run.txt

          foreach ($test in $tests) {

              Write-Host "Executing $test"

              mvn test `
                "-Dtest=$test" `
                "-DargLine=-javaagent:D:\parasoft_selenic_2026.1.0\selenic_agent.jar=captureDOM=true,screenshot=failures,selfHealing=true,createAPITests=false" `
                "-Dwebdriver.chrome.driver=D:\chromedriver-win64\chromedriver-win64\chromedriver.exe"

              if ($LASTEXITCODE -ne 0) {
                  throw "Execution failed for $test"
              }
          }
