name: Execute New Test Methods

on:
  push:
    branches:
      - main

jobs:
  execute-new-tests:

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect New Test Methods
        shell: powershell
        run: |

          Remove-Item tests-to-run.txt -ErrorAction SilentlyContinue

          $changedFiles = git diff --name-only HEAD~1 HEAD

          foreach ($file in $changedFiles) {

              if ($file -notmatch '^src/test/java/.*\.java$') {
                  continue
              }

              Write-Host "Checking file: $file"

              $className = [System.IO.Path]::GetFileNameWithoutExtension($file)

              $diff = git diff HEAD~1 HEAD -- $file

              $lines = $diff -split "`r?`n"

              for ($i = 0; $i -lt $lines.Count; $i++) {

                  if ($lines[$i].Trim() -match '^\+\s*@Test') {

                      for ($j = $i + 1; $j -lt $lines.Count; $j++) {

                          $line = $lines[$j]

                          if ($line -match '^\+.*public\s+void\s+([A-Za-z0-9_]+)\s*\(') {

                              $methodName = $Matches[1]

                              $testIdentifier = "$className#$
