name: Execute Classes With New Tests

on:
  push:
    branches:
      - main

jobs:

  execute-new-tests:

    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect New Tests
        shell: powershell
        run: |
          .\scripts\Detect-NewTests.ps1

      - name: Execute Classes
        shell: powershell
        run: |

          if (!(Test-Path testclasses.txt)) {
              Write-Host "Nothing to execute."
              exit 0
          }

          $classes = Get-Content testclasses.txt

          foreach ($class in $classes) {

              Write-Host "Executing class: $class"

              mvn test `
                "-Dtest=$class" `
                "-DargLine=-javaagent:D:\parasoft_selenic_2026.1.0\selenic_agent.jar=captureDOM=true,screenshot=failures,selfHealing=true,createAPITests=false" `
                "-Dwebdriver.chrome.driver=D:\chromedriver-win64\chromedriver-win64\chromedriver.exe"
          }
