name: Execute New Test Classes

on:
  push:
    branches:
      - main

jobs:
  execute-new-tests:

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find Changed Files
        shell: cmd
        run: |
          git diff --name-only HEAD~1 HEAD > changedfiles.txt
          type changedfiles.txt

      - name: Find Test Classes
        shell: cmd
        run: |
          findstr /i "Tests.java" changedfiles.txt > newtests.txt

      - name: Display Tests
        shell: cmd
        run: |
          if exist newtests.txt (
            echo New Test Classes:
            type newtests.txt
          ) else (
            echo No new test classes found.
          )
